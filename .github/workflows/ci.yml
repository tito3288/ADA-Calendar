name: Verify ADA Calendar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# This workflow never receives production credentials or sends provider mail.
env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  ADA_DEMO_MODE: "false"
  APP_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3100
  EMAIL_MODE: capture
  EMAIL_TEST_ALLOWLIST: ""
  OPENAI_API_KEY: ""
  RESEND_API_KEY: ""
  RESEND_WEBHOOK_SECRET: ""
  NEXT_PUBLIC_SUPABASE_URL: ""
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ""
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ""
  SUPABASE_SERVICE_ROLE_KEY: ""
  WORKER_SECRET: ""

jobs:
  checks:
    name: Lint, types, unit tests, production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install server audio validation runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Lint
        run: npm run lint
      - name: Generate route types for a clean checkout
        run: npm exec next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and server tests
        run: npm test
      - name: Build without live configuration
        run: npm run build

  browser:
    name: Isolated demo browser workflows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and system dependencies
        run: npm exec playwright install -- --with-deps chromium
      - name: Browser tests with captured providers
        # playwright.config.ts starts its own development server on port 3100,
        # seeds .data-e2e, uses .next-e2e, and refuses an existing server.
        run: npm run test:e2e
      - name: Retain browser failure evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
